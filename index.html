<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hops Food & Drinks - Menú</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Importación de fuente moderna para los textos generales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap?v=99" rel="stylesheet">
  <style>
    /* Forzar Plus Jakarta Sans en el cuerpo */
    html, body, button, input, select, textarea, div, span, p, a { 
      font-family: 'Plus Jakarta Sans', sans-serif !important; 
    }

    /* Estilo Pesado / Retro Contundente para los títulos de categorías (Tipo Perro Negro) */
    .retro-title { 
      font-family: 'Impact', 'Arial Black', sans-serif !important; 
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .light-grid {
      background-color: #f7f6f2;
      background-image: linear-gradient(rgba(0,180,216,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,180,216,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .cat-plate {
      background: linear-gradient(135deg, #00b4d8, #7b2cbf);
      padding: 8px 20px;
      display: inline-block;
      clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .menu-item { border-bottom: 1px solid rgba(0,0,0,0.06); }
    .menu-item:last-child { border-bottom: none; }
    nav::-webkit-scrollbar { display: none; }
    .category-btn { transition: all 0.2s; }
    .category-btn.active, .category-btn:hover { background: #00b4d822; border-color: #00b4d8; color: #0077b6; }
    .section-block { position: relative; z-index: 1; }
  </style>
</head>
<body class="min-h-screen light-grid text-gray-800" style="font-family: 'Plus Jakarta Sans', sans-serif !important;">

  <!-- BOTÓN INVISIBLE / SECRETO (Esquina inferior derecha) -->
  <div onclick="openAdmin()" class="fixed bottom-0 right-0 w-16 h-16 z-50 cursor-pointer" title="Panel Admin"></div>

  <!-- MODAL DE ADMINISTRACIÓN -->
  <div id="admin-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white border border-gray-200 p-6 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl text-gray-800">
      
      <!-- PANTALLA LOGIN ADMIN -->
      <div id="login-box">
        <div class="flex justify-between items-center mb-4">
          <h2 class="retro-title text-2xl text-cyan-700">HOPS ADMIN</h2>
          <button onclick="closeAdmin()" class="text-gray-500 hover:text-gray-800 text-lg font-bold">✕</button>
        </div>
        <p class="text-gray-600 text-xs mb-4">Ingresá la contraseña para administrar el menú.</p>
        <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-gray-50 border border-gray-300 focus:border-cyan-500 rounded-lg p-3 text-sm outline-none mb-4">
        <button onclick="checkLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded-lg text-sm uppercase tracking-wider transition">Ingresar</button>
        <p id="login-error" class="text-red-500 text-xs mt-2 hidden">Contraseña incorrecta.</p>
      </div>

      <!-- PANEL DE EDICIÓN -->
      <div id="panel-box" class="hidden">
        <div class="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
          <h2 class="retro-title text-xl text-cyan-700">Panel de Control</h2>
          <div class="flex gap-2">
            <button onclick="logout()" class="text-xs text-red-600 border border-red-200 px-2 py-1 rounded bg-red-50">Salir</button>
            <button onclick="closeAdmin()" class="text-gray-500 hover:text-gray-800 text-lg font-bold">✕</button>
          </div>
        </div>

        <!-- SECCIÓN ADMINISTRAR BANNER -->
        <div class="mb-6 bg-cyan-50/50 p-4 rounded-xl border border-cyan-100">
          <h3 class="text-xs uppercase tracking-wider text-cyan-700 mb-2 font-bold">Banner Principal de la Página</h3>
          <form id="banner-form" onsubmit="saveBanner(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] text-gray-600 mb-1">Seleccionar nueva foto de banner</label>
              <input type="file" id="banner-image-input" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg p-1.5 text-[11px] outline-none">
            </div>
            <div class="flex justify-end">
              <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-lg text-xs uppercase tracking-wider transition">Guardar Banner</button>
            </div>
          </form>
        </div>

        <h3 class="text-xs uppercase tracking-wider text-cyan-700 mb-2 font-bold">Agregar / Editar Ítems del Menú</h3>
        <!-- Formulario producto -->
        <form id="item-form" onsubmit="saveItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
          <input type="hidden" id="edit-id">
          <div>
            <label class="block text-[11px] text-gray-600 mb-1">Categoría</label>
            <select id="item-category" class="w-full bg-white border border-gray-300 rounded-lg p-2 text-xs outline-none focus:border-cyan-500">
              <option value="Cervezas">Cervezas</option>
              <option value="Tragos y Cócteles">Tragos y Cócteles</option>
              <option value="Autoría Hops">Autoría Hops</option>
              <option value="Espumantes">Espumantes</option>
              <option value="Destilados">Destilados</option>
              <option value="Bebidas Sin Alcohol">Bebidas Sin Alcohol</option>
              <option value="Entradas">Entradas</option>
              <option value="Burgers">Burgers</option>
              <option value="Extras">Extras</option>
              <option value="Pizzas">Pizzas</option>
              <option value="Milanesas">Milanesas</option>
              <option value="Tacos">Tacos</option>
              <option value="Sándwiches">Sándwiches</option>
              <option value="Postres">Postres</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-gray-600 mb-1">Nombre</label>
            <input type="text" id="item-name" placeholder="Ej: IPA Tirada" required class="w-full bg-white border border-gray-300 rounded-lg p-2 text-xs outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-[11px] text-gray-600 mb-1">Precio</label>
            <input type="text" id="item-price" placeholder="Ej: $3.800" required class="w-full bg-white border border-gray-300 rounded-lg p-2 text-xs outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-[11px] text-gray-600 mb-1">Foto (Dejar vacío para mantener la actual)</label>
            <input type="file" id="item-image" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg p-1.5 text-[11px] outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[11px] text-gray-600 mb-1">Descripción (opcional)</label>
            <input type="text" id="item-desc" placeholder="Ej: Pinta 500ml - Notas cítricas" class="w-full bg-white border border-gray-300 rounded-lg p-2 text-xs outline-none focus:border-cyan-500">
          </div>
          <div class="sm:col-span-2 flex justify-between items-center">
            <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="text-xs text-gray-500 hover:text-gray-800 hidden">Cancelar edición</button>
            <button type="submit" id="form-submit-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-lg text-xs uppercase tracking-wider transition ml-auto">Agregar Ítem</button>
          </div>
        </form>

        <h3 class="text-xs uppercase tracking-wider text-cyan-700 mb-2 font-bold">Listado actual</h3>
        <div id="admin-items-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>

    </div>
  </div>

  <!-- HEADER PÚBLICO -->
  <header class="text-center py-8 px-4 relative z-10">
    <p class="text-sm uppercase tracking-widest mb-3 text-cyan-700 font-semibold">Bienvenidos a</p>
    
    <!-- BANNER DINÁMICO -->
    <div id="banner-display-container" class="max-w-md mx-auto mb-4 hidden px-4">
      <img id="public-banner-img" src="" alt="Banner Hops" class="w-full h-40 sm:h-52 object-cover rounded-2xl shadow-md border border-gray-200">
    </div>
  </header>

  <!-- NAVEGACIÓN -->
  <nav id="cat-nav" class="sticky top-0 z-40 bg-white/90 backdrop-blur px-4 py-3 flex gap-2 overflow-x-auto border-b border-gray-200 shadow-sm justify-start md:justify-center"></nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-2xl mx-auto px-4 py-6 relative z-10">
    <div id="menu-container" class="space-y-6">
      <p id="loading-msg" class="text-cyan-700 text-center py-12 animate-pulse text-sm">Cargando el menú...</p>
    </div>
  </main>

  <!-- SCRIPT CON FIREBASE REALTIME DATABASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const PASS = "hops2026"; 

    const firebaseConfig = {
      apiKey: "AIzaSyBfskM_72bc0fE3mASnt8Tp41CXJm9xMxc",
      authDomain: "menu-hops.firebaseapp.com",
      databaseURL: "https://menu-hops-default-rtdb.firebaseio.com",
      projectId: "menu-hops",
      storageBucket: "menu-hops.firebasestorage.app",
      messagingSenderId: "143760990500",
      appId: "1:143760990500:web:3561f665410e6f6468d3b1"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const menuRef = ref(database, 'productos');
    const bannerRef = ref(database, 'configuracion/banner');

    let menuData = [];

    onValue(menuRef, (snapshot) => {
      const data = snapshot.val();
      menuData = [];
      if (data) {
        Object.keys(data).forEach((key) => {
          menuData.push({ id: key, ...data[key] });
        });
      }
      renderAll();
      renderAdminList();
    });

    onValue(bannerRef, (snapshot) => {
      const bannerUrl = snapshot.val();
      const bannerContainer = document.getElementById('banner-display-container');
      const bannerImg = document.getElementById('public-banner-img');

      if (bannerUrl) {
        bannerImg.src = bannerUrl;
        bannerContainer.classList.remove('hidden');
      } else {
        bannerContainer.classList.add('hidden');
      }
    });

    window.openAdmin = function() {
      document.getElementById('admin-modal').classList.remove('hidden');
    };

    window.closeAdmin = function() {
      document.getElementById('admin-modal').classList.add('hidden');
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
      resetForm();
    };

    window.checkLogin = function() {
      const p = document.getElementById('admin-pass').value;
      if (p === PASS) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('panel-box').classList.remove('hidden');
        renderAdminList();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    };

    window.logout = function() {
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('panel-box').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
      resetForm();
    };

    window.saveBanner = async function(e) {
      e.preventDefault();
      const fileInput = document.getElementById('banner-image-input');
      const file = fileInput.files[0];

      if (!file) {
        alert('Por favor elegí una imagen para el banner.');
        return;
      }

      const imgBase64 = await toBase64(file);
      await set(bannerRef, imgBase64);
      
      fileInput.value = '';
      alert('¡Banner actualizado con éxito!');
    };

    window.saveItem = async function(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;
      const category = document.getElementById('item-category').value;
      const name = document.getElementById('item-name').value;
      const price = document.getElementById('item-price').value;
      const desc = document.getElementById('item-desc').value;
      const file = document.getElementById('item-image').files[0];

      let imgBase64 = '';
      if (file) {
        imgBase64 = await toBase64(file);
      } else if (editId) {
        const existingItem = menuData.find(i => i.id === editId);
        if (existingItem) imgBase64 = existingItem.image || '';
      }

      if (editId) {
        const itemRef = ref(database, `productos/${editId}`);
        await set(itemRef, { category, name, price, desc, image: imgBase64 });
      } else {
        await push(menuRef, { category, name, price, desc, image: imgBase64 });
      }

      resetForm();
    };

    function toBase64(file) {
      return new Promise((resolve) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.readAsDataURL(file);
      });
    }

    window.editItem = function(id) {
      const item = menuData.find(i => i.id === id);
      if (!item) return;

      document.getElementById('edit-id').value = item.id;
      document.getElementById('item-category').value = item.category;
      document.getElementById('item-name').value = item.name;
      document.getElementById('item-price').value = item.price;
      document.getElementById('item-desc').value = item.desc || '';
      
      document.getElementById('form-submit-btn').innerText = 'Guardar Cambios';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      
      document.getElementById('item-form').scrollIntoView({ behavior: 'smooth' });
    };

    window.resetForm = function() {
      document.getElementById('item-form').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('form-submit-btn').innerText = 'Agregar Ítem';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    };

    window.deleteItem = function(id) {
      if (confirm('¿Seguro querés eliminar este producto?')) {
        const itemRef = ref(database, `productos/${id}`);
        remove(itemRef);
        if (document.getElementById('edit-id').value === id) {
          resetForm();
        }
      }
    };

    function renderAdminList() {
      const list = document.getElementById('admin-items-list');
      if (menuData.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-xs italic">No hay productos cargados.</p>';
        return;
      }
      list.innerHTML = menuData.map(i => `
        <div class="flex justify-between items-center bg-white p-2 rounded border border-gray-200 text-xs shadow-sm">
          <div class="truncate mr-2">
            <span class="text-cyan-700 font-semibold">[${i.category}]</span> 
            <span class="text-gray-800">${i.name}</span> - <span class="text-cyan-800 font-bold">${i.price}</span>
          </div>
          <div class="flex gap-1.5 flex-shrink-0">
            <button onclick="editItem('${i.id}')" class="text-cyan-700 hover:text-cyan-900 font-bold px-2 py-1 bg-cyan-50 rounded border border-cyan-200">Editar</button>
            <button onclick="deleteItem('${i.id}')" class="text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-red-50 rounded border border-red-200">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    function renderAll() {
      const categories = [...new Set(menuData.map(i => i.category))];
      
      const nav = document.getElementById('cat-nav');
      nav.innerHTML = categories.map((cat, idx) => `
        <button class="category-btn flex-shrink-0 px-3 py-1.5 rounded-full border border-gray-300 text-gray-600 text-xs font-medium whitespace-nowrap" onclick="document.getElementById('sec-${idx}').scrollIntoView({behavior:'smooth',block:'start'})">${cat}</button>
      `).join('');

      const container = document.getElementById('menu-container');
      if (categories.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center">El menú está vacío o se está actualizando.</p>';
        return;
      }

      container.innerHTML = categories.map((cat, idx) => {
        const items = menuData.filter(i => i.category === cat);
        const itemsHTML = items.map(i => `
          <div class="menu-item py-3">
            <div class="flex justify-between items-baseline gap-3">
              <div class="min-w-0">
                <span class="text-gray-900 text-sm font-medium block">${i.name}</span>
                ${i.desc ? `<span class="block text-gray-500 text-xs">${i.desc}</span>` : ''}
              </div>
              <span class="text-cyan-700 text-sm font-semibold whitespace-nowrap">${i.price}</span>
            </div>
            ${i.image ? `<div class="mt-2.5 flex justify-center bg-gray-100 p-2 rounded-xl border border-gray-200"><img src="${i.image}" loading="lazy" class="max-h-48 w-auto object-contain rounded-lg"></div>` : ''}
          </div>
        `).join('');

        return `
          <div id="sec-${idx}" class="section-block scroll-mt-16 mb-4">
            <div class="mb-3">
              <span class="cat-plate">
                <span class="text-white uppercase text-lg tracking-wide retro-title">${cat}</span>
              </span>
            </div>
            <div class="bg-white border border-gray-200/80 p-4 rounded-xl shadow-sm">
              ${itemsHTML}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
