<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hops Food & Drinks - Menú</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .neon-title { font-family: 'Permanent Marker', cursive; text-shadow: 0 0 12px #00e5ff88; }
    .perspective-grid {
      background-color: #0a0a12;
      background-image: linear-gradient(rgba(180,77,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(180,77,255,0.07) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .perspective-grid::before {
      content: '';
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 40vh;
      background: linear-gradient(to top, rgba(180,77,255,0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .cat-plate {
      background: linear-gradient(135deg, #00e5ff, #b44dff);
      padding: 4px 16px;
      display: inline-block;
      clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
    }
    .menu-item { border-bottom: 1px solid rgba(255,255,255,0.06); }
    .menu-item:last-child { border-bottom: none; }
    nav::-webkit-scrollbar { display: none; }
    .category-btn { transition: all 0.2s; }
    .category-btn.active, .category-btn:hover { background: #00e5ff22; border-color: #00e5ff; color: #00e5ff; }
    .section-block { position: relative; z-index: 1; }
  </style>
</head>
<body class="min-h-screen perspective-grid text-white">

  <!-- BOTÓN INVISIBLE / SECRETO (Esquina inferior derecha) -->
  <div onclick="openAdmin()" class="fixed bottom-0 right-0 w-16 h-16 z-50 cursor-pointer" title="Panel Admin"></div>

  <!-- MODAL DE ADMINISTRACIÓN -->
  <div id="admin-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#11131d] border border-cyan-500/30 p-6 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      
      <!-- PANTALLA LOGIN ADMIN -->
      <div id="login-box">
        <div class="flex justify-between items-center mb-4">
          <h2 class="neon-title text-2xl text-cyan-300">HOPS ADMIN</h2>
          <button onclick="closeAdmin()" class="text-gray-400 hover:text-white text-lg font-bold">✕</button>
        </div>
        <p class="text-gray-400 text-xs mb-4">Ingresá la contraseña para administrar el menú.</p>
        <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-[#0a0a12] border border-gray-700 focus:border-cyan-400 rounded-lg p-3 text-white text-sm outline-none mb-4">
        <button onclick="checkLogin()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2.5 rounded-lg text-sm uppercase tracking-wider transition">Ingresar</button>
        <p id="login-error" class="text-red-400 text-xs mt-2 hidden">Contraseña incorrecta.</p>
      </div>

      <!-- PANEL DE EDICIÓN -->
      <div id="panel-box" class="hidden">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-4">
          <h2 class="neon-title text-xl text-cyan-300">Panel de Control</h2>
          <div class="flex gap-2">
            <button onclick="logout()" class="text-xs text-red-400 border border-red-500/30 px-2 py-1 rounded">Salir</button>
            <button onclick="closeAdmin()" class="text-gray-400 hover:text-white text-lg font-bold">✕</button>
          </div>
        </div>

        <!-- Formulario nuevo producto -->
        <form id="item-form" onsubmit="saveItem(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 bg-[#0a0a12] p-4 rounded-xl border border-gray-800">
          <div>
            <label class="block text-[11px] text-gray-400 mb-1">Categoría</label>
            <select id="item-category" class="w-full bg-[#11131d] border border-gray-700 rounded-lg p-2 text-white text-xs outline-none focus:border-cyan-400">
              <option value="Tragos y Cócteles">Tragos y Cócteles</option>
              <option value="Autoría Hops">Autoría Hops</option>
              <option value="Espumantes">Espumantes</option>
              <option value="Destilados">Destilados</option>
              <option value="Bebidas Sin Alcohol">Bebidas Sin Alcohol</option>
              <option value="Entradas">Entradas</option>
              <option value="Burgers">Burgers</option>
              <option value="Extras">Extras</option>
              <option value="Pizzas">Pizzas</option>
              <option value="Milanesas">Milanesas</option>
              <option value="Tacos">Tacos</option>
              <option value="Sándwiches">Sándwiches</option>
              <option value="Postres">Postres</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-gray-400 mb-1">Nombre</label>
            <input type="text" id="item-name" placeholder="Ej: Fernet con Coca" required class="w-full bg-[#11131d] border border-gray-700 rounded-lg p-2 text-white text-xs outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="block text-[11px] text-gray-400 mb-1">Precio</label>
            <input type="text" id="item-price" placeholder="Ej: $4.500" required class="w-full bg-[#11131d] border border-gray-700 rounded-lg p-2 text-white text-xs outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="block text-[11px] text-gray-400 mb-1">Foto del producto (Cuadrada completa)</label>
            <input type="file" id="item-image" accept="image/*" class="w-full bg-[#11131d] border border-gray-700 rounded-lg p-1.5 text-white text-[11px] outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[11px] text-gray-400 mb-1">Descripción (opcional)</label>
            <input type="text" id="item-desc" placeholder="Ej: Vaso de vidrio, hielo y medida justa" class="w-full bg-[#11131d] border border-gray-700 rounded-lg p-2 text-white text-xs outline-none focus:border-cyan-400">
          </div>
          <div class="sm:col-span-2 flex justify-end">
            <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-4 py-2 rounded-lg text-xs uppercase tracking-wider transition">Agregar Ítem</button>
          </div>
        </form>

        <h3 class="text-xs uppercase tracking-wider text-cyan-400 mb-2 font-bold">Listado actual</h3>
        <div id="admin-items-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>

    </div>
  </div>

  <!-- HEADER PÚBLICO -->
  <header class="text-center py-8 px-4 relative z-10">
    <p class="text-sm uppercase tracking-widest mb-2 text-cyan-400">Bienvenidos a</p>
    <h1 class="neon-title text-5xl mb-1 text-cyan-300">HOPS</h1>
    <p class="text-lg text-gray-300">Food & Drinks</p>
  </header>

  <!-- NAVEGACIÓN -->
  <nav id="cat-nav" class="sticky top-0 z-40 bg-[#0a0a12]/95 backdrop-blur px-4 py-3 flex gap-2 overflow-x-auto border-b border-cyan-900/30"></nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-6 relative z-10">
    <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <script>
    const PASS = "hops2026"; 
    
    const defaultData = [
      { id: 1, category: "Tragos y Cócteles", name: "Fernet Branca", price: "$4.500", desc: "Con Coca-Cola y hielo", image: "" },
      { id: 2, category: "Burgers", name: "Cheeseburger", price: "$8.500", desc: "Doble medallón y quíntuple cheddar", image: "" }
    ];

    let menuData = JSON.parse(localStorage.getItem('hops_live_menu')) || defaultData;

    function openAdmin() {
      document.getElementById('admin-modal').classList.remove('hidden');
    }

    function closeAdmin() {
      document.getElementById('admin-modal').classList.add('hidden');
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
    }

    function checkLogin() {
      const p = document.getElementById('admin-pass').value;
      if (p === PASS) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('panel-box').classList.remove('hidden');
        renderAdminList();
      } else {
        document.getElementById('login-error').classList.add('hidden');
      }
    }

    function logout() {
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('panel-box').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
    }

    async function saveItem(e) {
      e.preventDefault();
      const category = document.getElementById('item-category').value;
      const name = document.getElementById('item-name').value;
      const price = document.getElementById('item-price').value;
      const desc = document.getElementById('item-desc').value;
      const file = document.getElementById('item-image').files[0];

      let imgBase64 = '';
      if (file) {
        imgBase64 = await toBase64(file);
      }

      menuData.push({ id: Date.now(), category, name, price, desc, image: imgBase64 });
      localStorage.setItem('hops_live_menu', JSON.stringify(menuData));
      
      document.getElementById('item-form').reset();
      renderAll();
      renderAdminList();
    }

    function toBase64(file) {
      return new Promise((resolve) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.readAsDataURL(file);
      });
    }

    function deleteItem(id) {
      menuData = menuData.filter(i => i.id !== id);
      localStorage.setItem('hops_live_menu', JSON.stringify(menuData));
      renderAll();
      renderAdminList();
    }

    function renderAdminList() {
      const list = document.getElementById('admin-items-list');
      if (menuData.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-xs italic">No hay productos cargados.</p>';
        return;
      }
      list.innerHTML = menuData.map(i => `
        <div class="flex justify-between items-center bg-[#11131d] p-2 rounded border border-gray-800 text-xs">
          <div>
            <span class="text-cyan-400 font-semibold">[${i.category}]</span> 
            <span class="text-gray-200">${i.name}</span> - <span class="text-cyan-300">${i.price}</span>
          </div>
          <button onclick="deleteItem(${i.id})" class="text-red-400 hover:text-red-300 font-bold px-2 py-1">Eliminar</button>
        </div>
      `).join('');
    }

    function renderAll() {
      const categories = [...new Set(menuData.map(i => i.category))];
      
      const nav = document.getElementById('cat-nav');
      nav.innerHTML = categories.map((cat, idx) => `
        <button class="category-btn flex-shrink-0 px-3 py-1.5 rounded-full border border-gray-600 text-gray-400 text-xs font-medium whitespace-nowrap" onclick="document.getElementById('sec-${idx}').scrollIntoView({behavior:'smooth',block:'start'})">${cat}</button>
      `).join('');

      const container = document.getElementById('menu-container');
      container.innerHTML = categories.map((cat, idx) => {
        const items = menuData.filter(i => i.category === cat);
        const itemsHTML = items.map(i => `
          <div class="menu-item py-3">
            <div class="flex justify-between items-baseline gap-3">
              <div class="min-w-0">
                <span class="text-gray-200 text-sm uppercase font-medium block">${i.name}</span>
                ${i.desc ? `<span class="block text-gray-400 text-xs">${i.desc}</span>` : ''}
              </div>
              <span class="text-cyan-300 text-sm font-medium whitespace-nowrap">${i.price}</span>
            </div>
            ${i.image ? `<div class="mt-2.5 flex justify-center bg-[#07070c] p-2 rounded-xl border border-cyan-500/20"><img src="${i.image}" class="max-h-48 w-auto object-contain rounded-lg"></div>` : ''}
          </div>
        `).join('');

        return `
          <div id="sec-${idx}" class="section-block scroll-mt-16 mb-4">
            <div class="mb-3">
              <span class="cat-plate">
                <span class="text-white uppercase text-sm tracking-wide font-bold" style="font-family:'Permanent Marker',cursive">${cat}</span>
              </span>
            </div>
            <div class="bg-[#11131d]/60 backdrop-blur border border-cyan-500/10 p-4 rounded-xl shadow-lg">
              ${itemsHTML}
            </div>
          </div>
        `;
      }).join('');
    }

    renderAll();
  </script>
</body>
</html>
