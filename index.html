<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hops Food & Drinks - Menú</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap?v=99" rel="stylesheet">
  <style>
    /* Forzar Plus Jakarta Sans en el cuerpo */
    html, body, button, input, select, textarea, div, span, p, a { 
      font-family: 'Plus Jakarta Sans', sans-serif !important; 
    }

    /* Estilo Pesado / Retro Contundente para los títulos de categorías */
    .retro-title { 
      font-family: 'Impact', 'Arial Black', sans-serif !important; 
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .light-grid {
      background-color: #f7f6f2;
      background-image: linear-gradient(rgba(0,180,216,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,180,216,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* PLACA DE CATEGORÍA MODIFICADA: Fondo negro minimalista y elegante */
    .cat-plate {
      background: #111111;
      padding: 8px 20px;
      display: inline-block;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .menu-item { border-bottom: 1px solid rgba(0,0,0,0.06); }
    .menu-item:last-child { border-bottom: none; }
    nav::-webkit-scrollbar { display: none; }
    .category-btn { transition: all 0.2s; }
    .category-btn.active, .category-btn:hover { background: #00b4d822; border-color: #00b4d8; color: #0077b6; }
    .section-block { position: relative; z-index: 1; }
  </style>
</head>
<body class="min-h-screen light-grid text-gray-800" style="font-family: 'Plus Jakarta Sans', sans-serif !important;">

  <div onclick="openAdmin()" class="fixed bottom-0 right-0 w-16 h-16 z-50 cursor-pointer" title="Panel Admin"></div>

      <div id="login-box">
        <div class="flex justify-between items-center mb-4">
          <h2 class="retro-title text-2xl text-cyan-700">HOPS ADMIN</h2>
          <button onclick="closeAdmin()" class="text-gray-500 hover:text-gray-800 text-lg font-bold">✕</button>
        </div>
        <p class="text-gray-600 text-xs mb-4">Ingresá la contraseña para administrar el menú.</p>
        <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-gray-50 border border-gray-300 focus:border-cyan-500 rounded-lg p-3 text-sm outline-none mb-4">
        <button onclick="checkLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded-lg text-sm uppercase tracking-wider transition">Ingresar</button>
        <p id="login-error" class="text-red-500 text-xs mt-2 hidden">Contraseña incorrecta.</p>
      </div>

      <div id="panel-box" class="hidden">
        <div class="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
          <h2 class="retro-title text-xl text-cyan-700">Panel de Control</h2>
          <div class="flex gap-2">
            <button onclick="logout()" class="text-xs text-red-600 border border-red-200 px-2 py-1 rounded bg-red-50">Salir</button>
            <button onclick="closeAdmin()" class="text-gray-500 hover:text-gray-800 text-lg font-bold">✕</button>
          </div>
        </div>
